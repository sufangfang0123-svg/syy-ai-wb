name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:public
      - run: npm run test:e2e:local
      - run: npm run build:public
        env:
          NEXT_PUBLIC_BASE_PATH: /syy-ai-wb
          NEXT_PUBLIC_BUILD_PROFILE: public_demo
          NEXT_PUBLIC_REAL_WORKSPACE_ENABLED: "false"
      - run: npm run verify:public-artifacts
      - run: npm run build:local
        env:
          NEXT_PUBLIC_BUILD_PROFILE: local_integrated
          NEXT_PUBLIC_REAL_WORKSPACE_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-1a0-test-reports
          path: |
            playwright-report/
            test-results/phase1a0/
          retention-days: 7
