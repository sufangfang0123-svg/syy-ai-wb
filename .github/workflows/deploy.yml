name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /syy-ai-wb
          NEXT_PUBLIC_BUILD_PROFILE: public_demo
          NEXT_PUBLIC_REAL_WORKSPACE_ENABLED: "false"
        run: npm run build:public
      - name: Verify public artifact boundaries and UAT hashes
        run: npm run verify:public-artifacts
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static export
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
